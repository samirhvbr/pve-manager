# /etc/fail2ban/jail.d/pve-blue3.conf

[pve-blue3]
enabled  = true
port     = 8006
filter   = pve-blue3
logpath  = /var/log/daemon.log
maxretry = 3
bantime  = 3600
findtime = 600

# A sub-rede do túnel de gerência na ignoreip: com o 8006 alcançável só pelo
# WireGuard, todo login legítimo vem de lá. Sem isto, um admin que erra a senha
# três vezes tranca a si mesmo justamente no túnel de emergência.
#
# Isto é uma escolha consciente: aceita-se não banir dentro do túnel, porque
# quem está lá dentro já provou posse de uma chave WireGuard individual.
ignoreip = 127.0.0.1/8 10.99.0.0/24
