# /etc/fail2ban/filter.d/pve-blue3.conf
#
# >>> ESTE REGEX PRECISA SER VALIDADO CONTRA O LOG REAL DE VOCÊS <<<
#
# Por quê: a linha de falha de senha é emitida pelo pve-access-control, que não
# está no repositório do pve-manager -- não consegui ler o formato exato aqui.
# O que EU confirmei neste repo é outra coisa: PVE/HTTPServer.pm:89,101 emite
# "authentication failure: ..." para ticket/token inválido, e essa linha NÃO
# traz o IP do cliente, então não serve para o fail2ban.
#
# Valide assim, depois de uma tentativa de login errada de propósito:
#
#   grep -i "authentication failure" /var/log/daemon.log | tail -5
#   fail2ban-regex /var/log/daemon.log /etc/fail2ban/filter.d/pve-blue3.conf
#
# Se o "Matched" vier zero, ajuste o failregex ao formato que o grep mostrou.
# Um jail que não casa nada falha em silêncio e passa a falsa sensação de
# proteção -- pior do que não ter jail nenhum.

[Definition]

failregex = pvedaemon\[\d+\]:\s+authentication failure; rhost=<HOST>\s+user=.*\s+msg=.*

ignoreregex =

[Init]
journalmatch = _SYSTEMD_UNIT=pvedaemon.service
